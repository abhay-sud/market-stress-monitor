name: One-time data_points backfill

# Manual trigger only — this is a one-off historical pull (5yr of FRED
# series + watchlist ticker prices), not a recurring job. See
# ingestion/src/backfill.ts. Safe to re-run: upserts on
# (series_id, observation_date).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Leave empty for the full backfill, 'positioning' for just CFTC/FINRA/CBOE, 'macro' for just copper futures + OFR stress index + Japan/Germany yields, 'global' for Japan/Germany yields + dollar/yen + euro/dollar, or 'credit' for the CCC/BB junk-bond spreads"
        required: false
        default: ""

jobs:
  backfill:
    # Full pipeline only: this repo, or a copy that set the MSM_MODE=full variable
    # (a copy without Supabase secrets runs run-your-own.yml instead).
    if: github.repository == 'abhay-sud/market-stress-monitor' || vars.MSM_MODE == 'full'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ingestion/package-lock.json

      - run: npm ci

      - run: npm run backfill -- ${ONLY:+--only=$ONLY}
        env:
          ONLY: ${{ inputs.only }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
